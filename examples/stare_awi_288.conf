# Experimental vertical-stare L2 example, AWI Halo Stream Line XR+, S/N 288.
# Date used in docs: 2024-07-20. Adapt all path roots for your system.
# Relative paths are resolved from the current working directory.

STARE_PRODUCT = 1
STARE_TYPE = epsilon

# Daily input layout: <root>/YYYY/YYYYMM/<basename>YYYYMMDD.nc
NC_STARE_L1_PATH = data/awi_288/stare/l1
NC_STARE_L1_BASENAME = awi_rao_dlidST00_l1_any_v04_

# REQUIRED: matching, independently generated wind L2 with wspeed.
# Observed VAD wind L2 for 2024-07-20 was verified; raw observations are not bundled.
NC_WIND_L2_PATH = data/awi_288/wind/l2
NC_WIND_L2_BASENAME = awi_rao_dlidVAD00_l2_wind_v00_

NC_STARE_L2_PATH = data/awi_288/stare/l2
NC_STARE_L2_BASENAME = awi_rao_dlidST00_l2_stare_v00_
NC_STARE_L2_QL_PATH = data/awi_288/stare/ql
NC_STARE_L2_QL_BASENAME = awi_rao_dlidST00_l2_stare_ql_

# Quicklook limits
STARE_QL_MAX_HEIGHT = 3000
STARE_QL_WMEAN_ABS = 1.5
STARE_QL_EPS_MIN = 1e-7
STARE_QL_EPS_MAX = 1e-1
STARE_QL_VAR_MIN = 1e-3
STARE_QL_VAR_MAX = 1e1

# Variables in the AWI stare L1 and supporting wind L2
STARE_DV_NAME = dv
STARE_INTENSITY_NAME = intensity
STARE_TIME_NAME = time
STARE_RANGE_NAME = range
STARE_WIND_NAME = wspeed

# Geometry and sampling: baseline values copied from the supplied config.
# Reassess sample spacing and beam divergence before scientific analysis.
STARE_ELEVATION_DEG = 90.0
WIND_SUPPORT_ELEVATION_DEG = 60.0
STARE_SAMPLE_SPACING_SECONDS = 6.0
STARE_BEAM_DIVERGENCE_RAD = 0.033

# Averaging
STARE_AVG_MIN = 30

# SNR screening (5.0 is a ratio used in the code, not 5 dB)
STARE_SNR_LIMIT = 5.0
STARE_N_NEGATIVES = 37
STARE_NOISE_MIN = 1e-8
STARE_NOISE_SMOOTH_MIN = 1e-8

# Horizontal wind-speed support field
STARE_U_MIN = 0.1
STARE_U_TIME_SMOOTH = 6
STARE_U_HEIGHT_SMOOTH = 3
STARE_U_USE_MEDIAN = 1

# Lag covariance and noise correction
STARE_LAGS = 0,1,2,3,4,5
STARE_FIT_LAGS = 1,5
STARE_MIN_SIGMA2 = 1e-7

# Estimated uncertainties: experimental propagation model
STARE_ADD_EPSILON_UNCERTAINTY = 1
STARE_EPSILON_MIN_SAMPLES = 3
